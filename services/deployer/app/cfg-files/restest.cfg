[BB]
name = Anonimizacion
command = python3 /code/process_dir.py --input @I --outfolder "@D" --save dicom
image = ddomizzi/cleaner:header
[END]

[BB]
name = ToRGB
command = python3 /code/dicom2rgb.py @I @D/@L
image = dicomtorgb:v1
[END]

[BB]
name = DetectorPulmon
command = python3 /code/detectorPulmones.py @I @D/@L
image = ddomizzi/deteccion:pulmon
[END]

[PATTERN]
name = Anonimizacionpattern
task = Anonimizacion
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[PATTERN]
name = ToRGBpattern
task = ToRGB
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[PATTERN]
name = DetectorPulmonpattern
task = DetectorPulmon
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[STAGE]
name = stage_Anonimizacion
source = @PWD/restest/catalogs/TESTCATALOG @PWD/restest/catalogs/TESTCATALOG/P1 @PWD/restest/catalogs/TESTCATALOG/P2 
sink = stage_ToRGB 
transformation = Anonimizacionpattern
[END]

[STAGE]
name = stage_ToRGB
source = stage_Anonimizacion 
sink = stage_DetectorPulmon 
transformation = ToRGBpattern
[END]

[STAGE]
name = stage_DetectorPulmon
source = stage_ToRGB 
sink = 
transformation = DetectorPulmonpattern
[END]

[NFR]
name = Manager/worker
[END]

[NFR]
name = AES4SEC
[END]

[NFR]
name = IDA
[END]

[WORKFLOW]
name = restest
stages = stage_Anonimizacion stage_ToRGB stage_DetectorPulmon 
catalogs = TESTCATALOG:c6a0602bc8c568f763eb48edc9caf0375cff457647fc444820061158d64745a7 TESTCATALOG/P1:fcd314af2f3e3109a7f158f634ac30b5ee0dea30c9cbeab4b42d30d1b9f34ea5 TESTCATALOG/P2:1dff6d954b357d7768e38926a54819b3f4db9eab915c20083e3b4575a98a4ed4 
[END]
