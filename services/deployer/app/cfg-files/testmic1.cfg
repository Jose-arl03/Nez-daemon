[BB]
name = Anonimizacion
command = python3 /code/process_dir.py --input @I --outfolder "@D" --save dicom
image = ddomizzi/cleaner:header
[END]

[BB]
name = ToRGB
command = python3 /code/dicom2rgb.py @I @D/@L
image = dicomtorgb:v1
[END]

[BB]
name = DetectorPulmon
command = python3 /code/detectorPulmones.py @I @D/@L
image = ddomizzi/deteccion:pulmon
[END]

[PATTERN]
name = Anonimizacionpattern
task = Anonimizacion
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[PATTERN]
name = ToRGBpattern
task = ToRGB
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[PATTERN]
name = DetectorPulmonpattern
task = DetectorPulmon
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[STAGE]
name = stage_Anonimizacion
source = @PWD/testmic1/catalogs/TESTCATALOG @PWD/testmic1/catalogs/TESTCATALOG/P2 @PWD/testmic1/catalogs/TESTCATALOG/P1 
sink = stage_ToRGB 
transformation = Anonimizacionpattern
[END]

[STAGE]
name = stage_ToRGB
source = stage_Anonimizacion 
sink = stage_DetectorPulmon 
transformation = ToRGBpattern
[END]

[STAGE]
name = stage_DetectorPulmon
source = stage_ToRGB 
sink = 
transformation = DetectorPulmonpattern
[END]

[NFR]
name = Manager/worker
[END]

[NFR]
name = AES4SEC
[END]

[NFR]
name = IDA
[END]

[WORKFLOW]
name = testmic1
stages = stage_Anonimizacion stage_ToRGB stage_DetectorPulmon 
catalogs = TESTCATALOG:23582d94f74aadc8f7e32fe893d1a40b34e4310460fcac0bb9d783521e1ca120 TESTCATALOG/P2:5bad85ea2fed40dd36791380d3a496df1aaf47f45a2cb0cd50487008484f7032 TESTCATALOG/P1:74fb6743cc88a016871c32fb769d6fa33e2b3fe1b248df5427ec93e6117b1700 
[END]
