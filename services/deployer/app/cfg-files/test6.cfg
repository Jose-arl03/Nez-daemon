[BB]
name = Anonimizacion
command = python3 /code/process_dir.py --input @I --outfolder "@D" --save dicom
image = ddomizzi/cleaner:header
[END]

[BB]
name = ToRGB
command = python3 /code/dicom2rgb.py @I @D/@L
image = dicomtorgb:v1
[END]

[BB]
name = DetectorPulmon
command = python3 /code/detectorPulmones.py @I @D/@L
image = ddomizzi/deteccion:pulmon
[END]

[PATTERN]
name = Anonimizacionpattern
task = Anonimizacion
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[PATTERN]
name = ToRGBpattern
task = ToRGB
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[PATTERN]
name = DetectorPulmonpattern
task = DetectorPulmon
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[STAGE]
name = stage_Anonimizacion
source = @PWD/test6/catalogs/TESTCATALOG/P1 @PWD/test6/catalogs/TESTCATALOG/P2 @PWD/test6/catalogs/TESTCATALOG 
sink = stage_ToRGB 
transformation = Anonimizacionpattern
[END]

[STAGE]
name = stage_ToRGB
source = stage_Anonimizacion 
sink = stage_DetectorPulmon 
transformation = ToRGBpattern
[END]

[STAGE]
name = stage_DetectorPulmon
source = stage_ToRGB 
sink = 
transformation = DetectorPulmonpattern
[END]

[NFR]
name = Manager/worker
[END]

[NFR]
name = AES4SEC
[END]

[NFR]
name = IDA
[END]

[WORKFLOW]
name = test6
stages = stage_Anonimizacion stage_ToRGB stage_DetectorPulmon 
catalogs = TESTCATALOG/P1:5b0f2662b3cbf7ccdb020d45d9378fac3e7bce932e2caaf1489ecaae42ea7dda TESTCATALOG/P2:0e6fce2c3acad329951d312db88a8cd45e1073dc1b438fe771cb2909c9ce34b6 TESTCATALOG:2821478b27ddcc53e3d684d4e17c4ca62121bbfc0caf9201c55d44e45db6a0d5 
