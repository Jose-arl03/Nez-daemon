[BB]
name = Anonimizacion
command = python3 /code/process_dir.py --input @I --outfolder "@D" --save dicom
image = ddomizzi/cleaner:header
[END]

[BB]
name = ToRGB
command = python3 /code/dicom2rgb.py @I @D/@L
image = dicomtorgb:v1
[END]

[BB]
name = DetectorPulmon
command = python3 /code/detectorPulmones.py @I @D/@L
image = ddomizzi/deteccion:pulmon
[END]

[PATTERN]
name = Anonimizacionpattern
task = Anonimizacion
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[PATTERN]
name = ToRGBpattern
task = ToRGB
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[PATTERN]
name = DetectorPulmonpattern
task = DetectorPulmon
pattern = MW
workers = 2
loadbalancer = TC:DL
[END]

[STAGE]
name = stage_Anonimizacion
source = @PWD/test4/catalogs/TESTCATALOG @PWD/test4/catalogs/TESTCATALOG/P2 @PWD/test4/catalogs/TESTCATALOG/P1 
sink = stage_ToRGB 
transformation = Anonimizacionpattern
[END]

[STAGE]
name = stage_ToRGB
source = stage_Anonimizacion 
sink = stage_DetectorPulmon 
transformation = ToRGBpattern
[END]

[STAGE]
name = stage_DetectorPulmon
source = stage_ToRGB 
sink = 
transformation = DetectorPulmonpattern
[END]

[NFR]
name = Manager/worker
[END]

[NFR]
name = AES4SEC
[END]

[NFR]
name = IDA
[END]

[WORKFLOW]
name = test4
stages = stage_Anonimizacion stage_ToRGB stage_DetectorPulmon 
catalogs = TESTCATALOG:e0ee21e2172c242b64a8c55d5c0d1cd2aebe48d0fb066a9a64a8bed803f75a90 TESTCATALOG/P2:9e7182c7d6fd4338044e259bf072d30f87a7b1f889ecc2c7898919f5df0e3933 TESTCATALOG/P1:27a1dd56b45346fbc38f5defdf6752ad685abdf0bac287ed50853f26f79018f3 
[END]
